<header class="fixed-top">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-uppercase fw-bold d-block d-md-none" href="{% url 'index' %}">
                FAM DIGITAL
            </a>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample"
                aria-controls="navbarsExample" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse d-md-flex" id="navbarsExample">
                <a class="navbar-brand text-uppercase fw-bold col-md-3 me-0 d-none d-md-block" href="{% url 'index' %}">
                    FAM DIGITAL
                </a>
                {% if user.is_authenticated %}
                    <ul class="navbar-nav col-md-6 justify-content-md-center">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/students/' %}active{% endif %}"
                                href="{% url 'students' %}">Alunos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '#' %}active{% endif %}"
                                href="#">Menu 02</a>
                        </li>
                    </ul>
                    <div class="d-md-flex col-md-3 justify-content-md-end">
                        <div class="flex-fill text-end">
                            {% if user.is_superuser %}
                                <button type="button" class="btn btn-outline-warning btn-custom-header">
                                    <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                                </button>
                            {% else %}
                                <button type="button" class="btn btn-outline-success btn-custom-header">
                                    <a class="nav-link" href="{% url 'profile' %}">Perfil</a>
                                </button>
                            {% endif %}
                            <button type="button" class="btn btn-outline-light btn-custom-header">
                                <a class="nav-link" href="{% url 'logout' %}">Sair</a>
                            </button>               
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
