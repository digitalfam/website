{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastro de Funcionário{% endblock title %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'app/css/cadastroFuncionario.css' %}">
{% endblock extra_css %}

{% block content %}
<div class="container mt-5">
  
        <div class="main-content">
            <div class="cabecalho">
                <div class="header-container">
                    <h2>
                        <div class="img-container">
                            <img src="{% static 'app/img/funcionario.png' %}" alt="Avatar do Funcionario" />
                        </div>
                        Cadastro de Funcionários
                    </h2>
                </div>
           
                <div class="actions-container">
                    <div class="actions">
                        <button type="button" class="cancel" onclick="window.location.href='{% url 'index' %}'">Cancelar</button>
                        <button type="submit" class="save">Salvar</button>
                    </div>
                </div>
            </div>
            <form>
                <div class="form-group">
                    <div class="left-column">
                        <label for="username" class="label">Nome de Usuário</label>
                        <input type="text" id="username" name="username" placeholder="Nome de Usuário" class="campo">
                        
                        <label for="password1" class="label">Senha</label>
                        <input type="password" id="password1" name="password1" placeholder="Senha" class="campo">
                        
                        <label for="password2" class="label">Confirme a Senha</label>
                        <input type="password" id="password2" name="password2" placeholder="Confirme a Senha" class="campo">
                        
                        <label for="role" class="label">Função</label>
                        <select id="role" name="role" class="campo">
                            <option value="">Selecione uma função</option>
                            <option value="RESPONSAVEL">Responsável</option>
                            <option value="FUNCIONARIO">Funcionário</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                        
                        <label for="cpf" class="label">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="CPF" class="campo">
                        
                        <label for="phone" class="label">Telefone</label>
                        <input type="tel" id="phone" name="phone" placeholder="Telefone" class="campo">
                        
                        <label for="address" class="label">Endereço</label>
                        <input type="text" id="address" name="address" placeholder="Endereço" class="campo">
                        
                        <label for="neighborhood" class="label">Bairro</label>
                        <input type="text" id="neighborhood" name="neighborhood" placeholder="Bairro" class="campo">
                        
                        
                    </div>
                    <div class="right-column" style="display: flex; flex-direction: column; justify-content: flex-start;">
                        
                        <label for="photo" class="upload-label">
                            <input type="file" id="photo" name="photo" accept="image/*" onchange="previewImage(event)">
                            <div class="image-preview" id="image-preview"></div>
                            <div class="edit-icon"><i class="fa-regular fa-pen-to-square"></i></div>
                        </label>
                        
                        <label for="number" class="label">Número</label>
                        <input type="text" id="number" name="number" placeholder="Número" class="campo">
                        
                        <label for="urban_or_rural" class="label">Zona</label>
                        <select id="urban_or_rural" name="urban_or_rural" class="campo">
                            <option value="Urbano">Urbano</option>
                            <option value="Rural">Rural</option>
                        </select>

                        <label for="city" class="label">Cidade</label>
                        <input type="text" id="city" name="city" placeholder="Cidade" value="Muzambinho-MG" class="campo">

                        <label for="occupation" class="label">Ocupação</label>
                        <select id="occupation" name="occupation" class="campo">
                            <option value="">Selecione uma ocupação</option>
                            {% for occupation in occupations %}
                                <option value="{{ occupation.id }}">{{ occupation.name }}</option>
                            {% endfor %}
                        </select>
                        
                        <label for="salary" class="label">Salário</label>
                        <input type="number" id="salary" name="salary" placeholder="Salário" class="campo">
                        
                        <label for="admission" class="label">Data de Admissão</label>
                        <input type="date" id="admission" name="admission" class="campo">
                        
                        <label for="emergency_phone" class="label">Telefone de Emergência</label>
                        <input type="tel" id="emergency_phone" name="emergency_phone" placeholder="Telefone de Emergência" class="campo">
                    </div>
                </div>
            </form>
        </div>
    </div>


<script>
    document.addEventListener("DOMContentLoaded", function() {
        var styleCss = document.getElementById("style-css");
        if (styleCss) {
            styleCss.parentNode.removeChild(styleCss);
        }
    });

    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function() {
            var output = document.getElementById('image-preview');
            output.style.backgroundImage = 'url(' + reader.result + ')';
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

{% endblock content %}
